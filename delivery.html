<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Delivery Dashboard – Shree Radha Enterprises</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
  <style>
    :root {
      --ink: #182230;
      --paper: #f6f4ee;
      --panel: #fff;
      --line: #dfdcd3;
      --radius: 8px;
      --shadow: 0 1px 2px rgba(24, 34, 48, .05), 0 4px 14px rgba(24, 34, 48, .05);
    }

    body {
      font-family: "IBM Plex Sans", sans-serif;
      background: var(--paper);
      color: var(--ink);
      padding: 20px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 20px;
      margin-bottom: 20px;
    }

    .flex {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .hidden {
      display: none;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 8px;
      border-bottom: 1px solid var(--line);
    }

    th {
      background: var(--ink);
      color: #fff;
      text-align: left;
    }

    select {
      padding: 4px 6px;
    }

    #loginError {
      color: #c00;
    }
  </style>
</head>

<body>
  <h1>Delivery Dashboard</h1>
  <!-- Sign‑in form -->

  <section id="loginSection" class="card">
    <h2>Login</h2>
    <div class="flex">
      <label>Email:<input type="email" id="email"></label>
      <label>Password:<input type="password" id="password"></label>
      <button id="loginBtn">Sign In</button>
    </div>
    <p id="loginError" class="hidden"></p>
  </section>

  <!-- Bill list – hidden until logged in -->
  <section id="billsSection" class="card hidden">
    <h2>Pending Bills</h2>
    <table id="billsTable">
      <thead>
        <tr>
          <th>Bill No</th>
          <th>Party Name</th>
          <th>Amount Pending</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>

<script>
  // ----- 1. Supabase Initialization -----
  const SUPABASE_URL = 'https://supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRha3d3aGJzd2FreW9yZmZwaW9tIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0OTg3NDIsImV4cCI6MjEwMzA3NDc0Mn0.TF0CfVqNqdeqY-WiKQdjm5-QvtzOvGVRfYOSFrAlsbs';
  const PARTNER_LOGIN_DOMAIN = 'delivery.invalid'; // Must match Edge Function LOGIN_DOMAIN

  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // Exact same status values as your Admin dashboard
  const STATUS_OPTIONS = ["", "Signed", "Cash", "UPI/Bank", "Cheque", "Cancelled", "Part Delivered"];

  // ----- 2. DOM Elements -----
  const loginBtn = document.getElementById('loginBtn');
  const loginError = document.getElementById('loginError');
  const loginSection = document.getElementById('loginSection');
  const billsSection = document.getElementById('billsSection');
  const billsTableBody = document.querySelector('#billsTable tbody');

  let billsChannel = null;

  function showError(msg) {
    loginError.textContent = msg;
    loginError.classList.remove('hidden');
  }

  // ----- 3. Login Handler -----
  loginBtn.addEventListener('click', async () => {
    const rawInput = document.getElementById('email').value.trim().toLowerCase();
    const pwd = document.getElementById('password').value;

    if (!rawInput || !pwd) {
      return showError('Provide Login ID & password');
    }

    // Appends @delivery.invalid automatically when partner enters e.g. "mukesh4821"
    const loginEmail = rawInput.includes('@')
      ? rawInput
      : `${rawInput}@${PARTNER_LOGIN_DOMAIN}`;

    const { data: authData, error: authError } = await supabaseClient.auth.signInWithPassword({
      email: loginEmail,
      password: pwd
    });

    if (authError || !authData.user) {
      return showError('Invalid Login ID or password');
    }

    const success = await loadUserProfileAndBills(authData.user.id);
    if (!success) {
      await supabaseClient.auth.signOut();
    }
  });

  // ----- 4. Verify Profile in user_roles & Load Bills -----
  async function loadUserProfileAndBills(userId) {
    const { data: profile, error: roleError } = await supabaseClient
      .from('user_roles')
      .select('user_id, name, role, active')
      .eq('user_id', userId)
      .single();

    if (roleError || !profile) {
      showError('User profile not found');
      return false;
    }

    if (!profile.active) {
      showError('Your account has been deactivated. Contact admin.');
      return false;
    }

    localStorage.setItem('deliveryPersonId', profile.user_id);
    localStorage.setItem('deliveryPersonName', profile.name);
    localStorage.setItem('userRole', profile.role);

    loginError.classList.add('hidden');
    loginSection.classList.add('hidden');
    await loadBills(profile);
    return true;
  }

  // ----- 5. Fetch Only Open Bills Assigned to This Partner -----
  async function loadBills(profile) {
    let query = supabaseClient
      .from('bills')
      .select('id, bill_no, retailer, total_amount, delivery_date, delivery_status, delivery_partner')
      .is('delivery_status', null) // Shows only open bills not yet marked Signed/Cash/UPI/etc.
      .order('delivery_date', { ascending: false });

    // Filter strictly to bills assigned to the logged-in delivery partner
    if (profile.role === 'delivery') {
      const cleanName = (profile.name || '').trim();
      if (!cleanName) {
        return showError('Profile name missing. Contact admin.');
      }
      query = query.ilike('delivery_partner', `%${cleanName}%`);
    }

    const { data, error } = await query;
    if (error) {
      console.error('loadBills error:', error);
      return showError('Failed to load bills: ' + error.message);
    }

    renderBills(data);
    billsSection.classList.remove('hidden');

    // Subscribe once to real-time updates from Admin or database
    if (!billsChannel) {
      billsChannel = supabaseClient
        .channel('public:bills')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'bills' }, () => {
          // Reload list whenever Admin assigns a new bill or updates a status
          loadBills(profile);
        })
        .subscribe();
    }
  }

  // ----- 6. Render Table Rows & Save Status Changes -----
  function renderBills(bills) {
    billsTableBody.innerHTML = '';

    if (!bills || bills.length === 0) {
      billsTableBody.innerHTML = `<tr><td colspan="4">No pending bills assigned to you.</td></tr>`;
      return;
    }

    bills.forEach(b => {
      const tr = document.createElement('tr');
      tr.dataset.id = b.id;
      const currentStatus = b.delivery_status || '';

      const optionsHtml = STATUS_OPTIONS.map(opt => `
        <option value="${opt}" ${currentStatus === opt ? 'selected' : ''}>
          ${opt === '' ? '-- Select Status --' : opt}
        </option>
      `).join('');

      tr.innerHTML = `
        <td>${b.bill_no ?? '-'}</td>
        <td>${b.retailer ?? '-'}</td>
        <td>₹${Number(b.total_amount || 0).toLocaleString('en-IN')}</td>
        <td><select class="statusSelect">${optionsHtml}</select></td>
      `;

      const sel = tr.querySelector('.statusSelect');
      sel.addEventListener('change', async () => {
        const newStatus = sel.value === '' ? null : sel.value;
        sel.disabled = true;

        const { data: updated, error } = await supabaseClient
          .from('bills')
          .update({ delivery_status: newStatus })
          .eq('id', b.id)
          .select('id'); // Confirms a row was actually updated (catches silent RLS blocks)

        sel.disabled = false;

        if (error) {
          console.error('Update error:', error);
          alert('Failed to save status: ' + error.message);
        } else if (!updated || updated.length === 0) {
          alert('Permission denied by database (RLS). Ask admin to enable delivery update access.');
        }
      });

      billsTableBody.appendChild(tr);
    });
  }

  // ----- 7. Auto-Restore Session on Page Refresh -----
  (async () => {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session?.user) {
      await loadUserProfileAndBills(session.user.id);
    }
  })();
</script>
</body>

</html>
