<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Delivery Dashboard – Shree Radha Enterprises</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
  <style>
    :root {
      --ink: #182230;
      --paper: #f6f4ee;
      --panel: #fff;
      --line: #dfdcd3;
      --radius: 8px;
      --shadow: 0 1px 2px rgba(24, 34, 48, .05), 0 4px 14px rgba(24, 34, 48, .05);
    }

    body {
      font-family: "IBM Plex Sans", sans-serif;
      background: var(--paper);
      color: var(--ink);
      padding: 20px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 20px;
      margin-bottom: 20px;
    }

    .flex {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .hidden {
      display: none;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 8px;
      border-bottom: 1px solid var(--line);
    }

    th {
      background: var(--ink);
      color: #fff;
      text-align: left;
    }

    select {
      padding: 4px 6px;
    }

    #loginError {
      color: #c00;
    }
  </style>
</head>

<body>
  <h1>Delivery Dashboard</h1>
  <!-- Sign‑in form -->

  <section id="loginSection" class="card">
    <h2>Login</h2>
    <div class="flex">
      <label>Email:<input type="email" id="email"></label>
      <label>Password:<input type="password" id="password"></label>
      <button id="loginBtn">Sign In</button>
    </div>
    <p id="loginError" class="hidden"></p>
  </section>

  <!-- Bill list – hidden until logged in -->
  <section id="billsSection" class="card hidden">
    <h2>Pending Bills</h2>
    <table id="billsTable">
      <thead>
        <tr>
          <th>Bill No</th>
          <th>Party Name</th>
          <th>Amount Pending</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>

  <script>
  // ----- 1. Supabase Initialization -----
  const SUPABASE_URL = 'https://dakwwhbswakyorffpiom.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRha3d3aGJzd2FreW9yZmZwaW9tIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0OTg3NDIsImV4cCI6MjEwMzA3NDc0Mn0.TF0CfVqNqdeqY-WiKQdjm5-QvtzOvGVRfYOSFrAlsbs';
  const PARTNER_LOGIN_DOMAIN = 'delivery.invalid'; // Must match LOGIN_DOMAIN in Edge Function

  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // ----- 2. DOM Elements -----
  const loginBtn = document.getElementById('loginBtn');
  const loginError = document.getElementById('loginError');
  const loginSection = document.getElementById('loginSection');
  const billsSection = document.getElementById('billsSection');
  const billsTableBody = document.querySelector('#billsTable tbody');

  let billsChannel = null; // Prevents duplicate realtime listeners

  function showError(msg) {
    loginError.textContent = msg;
    loginError.classList.remove('hidden');
  }

  // ----- 3. Login Handler -----
  loginBtn.addEventListener('click', async () => {
    const rawInput = document.getElementById('email').value.trim().toLowerCase();
    const pwd = document.getElementById('password').value;

    if (!rawInput || !pwd) {
      return showError('Provide Login ID & password');
    }

    // Automatically append @delivery.invalid if user enters just their Login ID (e.g. mukesh4821)
    const loginEmail = rawInput.includes('@')
      ? rawInput
      : `${rawInput}@${PARTNER_LOGIN_DOMAIN}`;

    // Step A: Verify password via Supabase Auth
    const { data: authData, error: authError } = await supabaseClient.auth.signInWithPassword({
      email: loginEmail,
      password: pwd
    });

    if (authError || !authData.user) {
      return showError('Invalid Login ID or password');
    }

    // Step B: Verify active profile in user_roles
    const success = await loadUserProfileAndBills(authData.user.id);
    if (!success) {
      await supabaseClient.auth.signOut();
    }
  });

  // ----- 4. Fetch Role & Load Assigned Bills -----
  async function loadUserProfileAndBills(userId) {
    const { data: profile, error: roleError } = await supabaseClient
      .from('user_roles')
      .select('user_id, name, role, active')
      .eq('user_id', userId)
      .single();

    if (roleError || !profile) {
      showError('User profile not found');
      return false;
    }

    if (!profile.active) {
      showError('Account deactivated. Contact admin.');
      return false;
    }

    localStorage.setItem('deliveryPersonId', profile.user_id);
    localStorage.setItem('deliveryPersonName', profile.name);
    localStorage.setItem('userRole', profile.role);

    loginError.classList.add('hidden');
    loginSection.classList.add('hidden');
    await loadBills(profile);
    return true;
  }

  // ----- 5. Fetch Pending Bills & Subscribe to Realtime Updates -----
  async function loadBills(profile) {
    let query = supabaseClient
      .from('bills')
      .select('id, bill_no, retailer, total_amount, delivery_status, delivery_partner')
      .eq('delivery_status', 'Pending')
      .order('bill_no');

    // If logged in as a delivery partner, only show bills assigned to their name
    if (profile.role === 'delivery') {
      query = query.eq('delivery_partner', profile.name);
    }

    const { data, error } = await query;
    if (error) {
      console.error('loadBills error:', error);
      return showError('Failed to load bills: ' + error.message);
    }

    renderBills(data);
    billsSection.classList.remove('hidden');

    // Subscribe once to real-time bill status updates
    if (!billsChannel) {
      billsChannel = supabaseClient
        .channel('public:bills')
        .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'bills' }, payload => {
          const changed = payload.new;
          const row = billsTableBody.querySelector(`tr[data-id='${changed.id}']`);
          if (row) {
            row.querySelector('.statusSelect').value = changed.delivery_status;
          }
        })
        .subscribe();
    }
  }

  // ----- 6. Render Table Rows & Attach Status Change Listeners -----
  function renderBills(bills) {
    billsTableBody.innerHTML = '';

    if (!bills || bills.length === 0) {
      billsTableBody.innerHTML = `<tr><td colspan="4">No pending bills assigned.</td></tr>`;
      return;
    }

    bills.forEach(b => {
      const tr = document.createElement('tr');
      tr.dataset.id = b.id;
      tr.innerHTML = `
        <td>${b.bill_no ?? '-'}</td>
        <td>${b.retailer ?? '-'}</td>
        <td>₹${b.total_amount ?? 0}</td>
        <td>
          <select class="statusSelect">
            <option value="Pending" ${b.delivery_status === 'Pending' ? 'selected' : ''}>Pending</option>
            <option value="Delivered" ${b.delivery_status === 'Delivered' ? 'selected' : ''}>Delivered</option>
            <option value="Failed" ${b.delivery_status === 'Failed' ? 'selected' : ''}>Failed</option>
          </select>
        </td>`;

      const sel = tr.querySelector('.statusSelect');
      sel.addEventListener('change', async () => {
        const newStatus = sel.value;
        const { error } = await supabaseClient
          .from('bills')
          .update({ delivery_status: newStatus })
          .eq('id', b.id);

        if (error) {
          console.error('Update error:', error);
          alert('Could not update status: ' + error.message);
        }
      });

      billsTableBody.appendChild(tr);
    });
  }

  // ----- 7. Auto-Restore Session on Page Refresh -----
  (async () => {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session?.user) {
      await loadUserProfileAndBills(session.user.id);
    }
  })();
</script>
</body>

</html>
