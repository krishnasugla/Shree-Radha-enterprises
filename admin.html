<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin – Add Delivery Person</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Netflix-style fonts -->
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
  <style>
    /* Netflix cinematic dark theme */
    :root {
      --netflix-red: #E50914;
      --netflix-dark-red: #B81D24;
      --bg-gradient: radial-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.9)), url('https://nflxext.com');
    }

    body {
      font-family: 'Roboto', sans-serif;
      background: #000;
      background-image: var(--bg-gradient);
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: #fff;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Top Navigation bar mimicking Netflix branding header */
    header {
      padding: 20px 60px;
      display: flex;
      align-items: center;
    }

    .logo {
      color: var(--netflix-red);
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: -1px;
      text-transform: uppercase;
      text-decoration: none;
    }

    /* Main Container */
    .wrapper {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* Sign-in style adaptive card container */
    .card {
      background: rgba(0, 0, 0, 0.75);
      border-radius: 4px;
      padding: 60px;
      width: 100%;
      max-width: 450px;
      box-sizing: border-box;
      border: none;
      margin: 0 auto;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      margin-top: 0;
      margin-bottom: 28px;
    }

    /* Floating-style form entry fields */
    .input-group {
      position: relative;
      margin-bottom: 16px;
    }

    input {
      width: 100%;
      padding: 16px 20px;
      background: #333;
      border: none;
      border-radius: 4px;
      color: #fff;
      font-size: 1rem;
      box-sizing: border-box;
      transition: background 0.2s ease;
    }

    input:focus {
      background: #454545;
      outline: none;
    }

    /* Label overlay mimicking login inputs */
    label {
      display: none; 
    }

    /* Primary Netflix CTA Button */
    button {
      width: 100%;
      padding: 16px;
      background-color: var(--netflix-red);
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      font-weight: 700;
      margin-top: 24px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    button:hover {
      background-color: var(--netflix-dark-red);
    }

    /* Generated Output Section layout styling */
    #result {
      margin-top: 24px;
      background: #181818;
      border-left: 4px solid var(--netflix-red);
      padding: 16px;
      border-radius: 4px;
      font-size: 0.9rem;
      word-break: break-all;
      line-height: 1.4;
    }

    #result strong {
      color: #aaa;
      display: block;
      margin-bottom: 6px;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    #result a {
      color: #0071eb;
      text-decoration: none;
      font-weight: 500;
    }

    #result a:hover {
      text-decoration: underline;
    }

    .hidden {
      display: none;
    }

    /* Utility spacing styling */
    .form-footer {
      color: #737373;
      font-size: 0.9rem;
      margin-top: 30px;
    }

    .form-footer span {
      color: #fff;
    }

    @media (max-width: 500px) {
      header { padding: 20px; }
      .card { padding: 40px 20px; }
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="logo">Back</a>
  </header>

  <div class="wrapper">
    <div class="card">
      <h1>Add Delivery Person</h1>
      
      <div class="input-group">
        <input type="text" id="name" placeholder="Name" autocomplete="off">
      </div>
      
      <div class="input-group">
        <input type="email" id="email" placeholder="Email" autocomplete="off">
      </div>
      
      <div class="input-group">
        <input type="password" id="pwd" placeholder="Password">
      </div>
      
      <button id="createBtn">Create Account</button>
      
      <div id="result" class="hidden"></div>

      <div class="form-footer">
        Administrator Console. New profiles reflect instantly on live <span>delivery systems</span>.
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://dakwwhbswakyorffpiom.supabase.co/rest/v1/';
    const SUPABASE_ANON_KEY = 'sb_publishable_IGXZnkTuoAkhJsS9LzrPRw_mZQgf1DT';
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function hash(p){ return CryptoJS.SHA256(p).toString(CryptoJS.enc.Hex); }

    document.getElementById('createBtn').onclick = async () => {
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const pwd = document.getElementById('pwd').value;
      if(!name||!email||!pwd){alert('All fields required');return;}

      // 1️⃣ Insert delivery person
      const {data:person, error:err1} = await supabase.from('delivery_people')
        .insert({name, email, password_hash: hash(pwd)})
        .select()
        .single();
      if(err1){alert('Error adding person: '+err1.message);return;}

      // 2️⃣ Generate a token
      const token = crypto.randomUUID();
      const {error:err2} = await supabase.from('delivery_tokens')
        .insert({token, delivery_person_id: person.id});
      if(err2){alert('Error creating token: '+err2.message);return;}

      // 3️⃣ Show the link
      const link = `${window.location.origin}/delivery.html?token=${token}`;
      const resDiv = document.getElementById('result');
      resDiv.innerHTML = `<strong>Generated On-boarding Link:</strong><a href="${link}" target="_blank">${link}</a>`;
      resDiv.classList.remove('hidden');
    };
  </script>
</body>
</html>
